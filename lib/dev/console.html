<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>literate-robot dev console</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 60rem; margin: 1rem auto; padding: 0 1rem; }
  header { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  header input { flex: 1; min-width: 12rem; }
  nav button { margin-right: .25rem; }
  nav button[aria-current="true"] { font-weight: bold; text-decoration: underline; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #8884; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  form { display: grid; gap: .5rem; max-width: 24rem; margin-top: .5rem; }
  label { display: grid; gap: .15rem; font-size: .9rem; }
  #msg { margin: .5rem 0; min-height: 1.2rem; }
  #msg.err { color: #c33; }
</style>
</head>
<body>
<h1>literate-robot / finance</h1>
<header>
  <label style="flex:1">API key
    <input id="key" type="password" autocomplete="off" placeholder="paste a key, or set FINANCE_API_KEY in .env">
  </label>
</header>
<div id="msg"></div>
<nav id="tabs"></nav>
<main id="view"></main>

<script>
const INJECTED_KEY = __INJECTED_KEY__;

const $ = (id) => document.getElementById(id);
const keyInput = $("key");
const store = {
  get() { try { return localStorage.getItem("apiKey") || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem("apiKey", v); } catch {} },
};
keyInput.value = INJECTED_KEY || store.get();
keyInput.addEventListener("change", () => { store.set(keyInput.value); show(current); });

// Build DOM without innerHTML: record text (e.g. bank descriptions) is untrusted.
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) el.append(kid instanceof Node ? kid : String(kid ?? ""));
  return el;
}

function say(text, err = false) { const m = $("msg"); m.textContent = text; m.className = err ? "err" : ""; }

async function api(method, path, body) {
  const res = await fetch("/finance" + path, {
    method,
    headers: { Authorization: "Bearer " + keyInput.value, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) throw new Error("401 unauthorized: check the API key");
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(`${res.status}: ` + JSON.stringify(data?.errors ?? data ?? "error"));
  return data;
}

const dollars = (c) => (c / 100).toFixed(2);
let accountNames = {};
async function loadAccounts() {
  const list = await api("GET", "/accounts");
  accountNames = Object.fromEntries(list.map((a) => [a.id, a.name]));
  return list;
}
const acct = (id) => accountNames[id] ?? id;
let categoryNames = {}, expenseNames = {};
async function loadLookups() {
  const [cats, exps] = await Promise.all([api("GET", "/categories"), api("GET", "/expenses")]);
  categoryNames = Object.fromEntries(cats.map((c) => [c.id, c.name]));
  expenseNames = Object.fromEntries(exps.map((e) => [e.id, e.name]));
  return { cats, exps };
}
const catName = (id) => (id == null ? "" : categoryNames[id] ?? id);
const expName = (id) => (id == null ? "" : expenseNames[id] ?? id);
const optionList = (items, blank) => [blank != null ? h("option", { value: "" }, blank) : null, items.map((i) => h("option", { value: i.id }, i.name))];
const toCents = (s) => Math.round(Number(s) * 100);
const field = (label, input) => h("label", {}, label, input);
const table = (heads, rows) => h("table", {}, h("thead", {}, h("tr", {}, heads.map((x) => h("th", {}, x)))), h("tbody", {}, rows));

async function accountSelect(name, list) {
  return h("select", { name, required: true }, list.map((a) => h("option", { value: a.id }, a.name)));
}

async function expenseSelect(name) {
  const expenses = await api("GET", "/expenses");
  return h("select", { name, required: true }, expenses.map((e) => h("option", { value: e.id }, e.name)));
}

function txnRows(list, extra) {
  return list.map((t) => h("tr", {},
    h("td", {}, h("a", { href: "#", onclick: (e) => { e.preventDefault(); show("detail:" + t.id); } }, t.date)),
    h("td", {}, acct(t.account_id)), h("td", {}, t.kind),
    h("td", {}, t.source + ":" + t.external_id.slice(0, 8)),
    h("td", {}, t.description || ""), h("td", { class: "num" }, dollars(t.amount_cents)),
    h("td", {}, t.status), h("td", {}, catName(t.category_id)), h("td", {}, expName(t.expense_id)),
    extra ? h("td", {}, extra(t)) : ""));
}
const txnHeads = ["Date", "Account", "Kind", "Source", "Description", "Amount", "Status", "Category", "Expense"];

const views = {
  async transactions() {
    await Promise.all([loadAccounts(), loadLookups()]);
    const filter = h("select", {}, ["", "pulled", "matched", "confirmed", "ignored"].map((s) => h("option", { value: s }, s || "all")));
    const q = h("input", { type: "search", placeholder: "search description / notes / merchant" });
    const from = h("input", { type: "date" }), to = h("input", { type: "date" });
    const body = h("div");
    const load = async () => {
      const qs = new URLSearchParams();
      for (const [k, el] of [["status", filter], ["q", q], ["from", from], ["to", to]]) if (el.value) qs.set(k, el.value);
      const list = await api("GET", "/transactions" + (qs.size ? "?" + qs : ""));
      // Bank records and transfer legs cannot be deleted here; the API refuses.
      body.replaceChildren(table(txnHeads.concat(""), txnRows(list, (t) => t.source !== "MAN" || t.kind === "transfer" ? "" :
        h("button", { onclick: async () => { if (confirm("Delete?")) { await run(() => api("DELETE", "/transactions/" + t.id)); load(); } } }, "delete"))));
    };
    for (const el of [filter, q, from, to]) el.addEventListener("change", () => run(load));
    await load();
    return [h("div", { style: "display:flex;gap:.5rem;flex-wrap:wrap" }, field("Status", filter), field("Search", q), field("From", from), field("To", to)), body];
  },

  async reconcile() {
    await loadAccounts();
    const { cats, exps } = await loadLookups();
    const list = await api("GET", "/transactions?status=pulled");
    const matched = await api("GET", "/transactions?status=matched");
    const reload = () => show("reconcile");
    const post = (t, action, body) => run(async () => {
      const res = await api("POST", `/transactions/${t.id}/${action}`, body);
      await reload();
      if (res?.auto_matched) say(`Matched. Also pre-matched ${res.auto_matched} other record(s) from the same merchant.`);
    });
    const autoCount = matched.filter((t) => t.auto_assigned).length;
    const pick = (t) => {
      if (t.kind !== "expense") return h("span", {}, h("button", { onclick: () => post(t, "confirm") }, "confirm"), h("button", { onclick: () => post(t, "ignore") }, "ignore"));
      const cat = h("select", {}, optionList(cats, "(category)"));
      const exp = h("select", {}, optionList(exps, "(recurring expense)"));
      return h("span", {}, cat, exp,
        h("button", { onclick: () => post(t, "reconcile", { category_id: cat.value, expense_id: exp.value }) }, "match"),
        h("button", { onclick: () => post(t, "ignore") }, "ignore"));
    };
    const confirmBtn = (t) => h("button", { onclick: () => post(t, "confirm") }, "confirm");
    return [
      h("p", {}, "Choose a category, or a recurring expense (which sets its category), then match. Income needs no category."),
      h("h2", {}, `Pulled (${list.length})`), table(txnHeads.concat(""), txnRows(list, pick)),
      h("h2", {}, `Matched, awaiting confirmation (${matched.length})`),
      h("p", {}, h("button", { disabled: autoCount === 0, onclick: () => run(async () => {
        const r = await api("POST", "/transactions/confirm_auto"); await reload(); say(`Confirmed ${r.confirmed} auto-matched record(s).`); }) },
        `Confirm all auto-matched (${autoCount})`), " Auto-matched = assigned by merchant memory and not touched by you."),
      table(txnHeads.concat(""), txnRows(matched, (t) => h("span", {}, confirmBtn(t), t.auto_assigned ? " auto" : ""))),
    ];
  },


  async merchants() {
    const { cats, exps } = await loadLookups();
    const list = await api("GET", "/merchants");
    const toggle = (m) => h("input", { type: "checkbox", checked: m.auto_assign, onchange: (e) =>
      run(() => api("PATCH", "/merchants/" + m.id, { merchant: { auto_assign: e.target.checked } })) });
    const del = (m) => h("button", { onclick: () => run(async () => { await api("DELETE", "/merchants/" + m.id); show("merchants"); }) }, "forget");
    return [
      h("p", {}, "Learned when you match a record. New and waiting records from the same merchant get the same category/expense."),
      table(["Merchant key", "Category", "Recurring expense", "Auto-assign", ""], list.map((m) => h("tr", {},
        h("td", {}, m.key), h("td", {}, catName(m.category_id)), h("td", {}, expName(m.expense_id)),
        h("td", {}, toggle(m)), h("td", {}, del(m))))),
    ];
  },

  async forecast() {
    await Promise.all([loadAccounts(), loadLookups()]);
    const today = new Date().toISOString().slice(0, 10);
    const from = h("input", { type: "date", value: today });
    const to = h("input", { type: "date", value: new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10) });
    const out = h("div");
    const load = () => run(async () => {
      const f = await api("GET", `/forecast?from=${from.value}&to=${to.value}`);
      out.replaceChildren(
        h("h2", {}, `Upcoming bills: ${dollars(f.total_cents)}`),
        table(["Date", "Expense", "Category", "Account", "Amount", "Basis"], f.occurrences.map((o) => h("tr", {},
          h("td", {}, o.date), h("td", {}, o.expense_name), h("td", {}, catName(o.category_id)), h("td", {}, o.account_id ? acct(o.account_id) : "(no account)"),
          h("td", { class: "num" }, o.amount_cents == null ? "?" : dollars(o.amount_cents)), h("td", {}, o.basis)))),
        h("h2", {}, "By account"),
        table(["Account", "Total"], Object.entries(f.totals_by_account).map(([id, c]) => h("tr", {}, h("td", {}, id ? acct(id) || "(no account)" : "(no account)"), h("td", { class: "num" }, dollars(c))))),
        f.unscheduled.length ? h("p", {}, "No anchor date, so not forecast: " + f.unscheduled.map((u) => u.expense_name).join(", ")) : "",
        f.unestimated ? h("p", {}, `${f.unestimated} occurrence(s) have no amount yet (no history or expected amount).`) : "");
    });
    [from, to].forEach((el) => el.addEventListener("change", load));
    await load();
    return [h("div", { style: "display:flex;gap:.5rem" }, field("From", from), field("To", to)), out];
  },

  async plan() {
    await loadAccounts();
    const to = h("input", { type: "date", value: new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10) });
    const inc = h("input", { type: "checkbox", checked: true });
    const out = h("div");
    const load = () => run(async () => {
      const p = await api("GET", `/transfers/needed?to=${to.value}&include_forecast=${inc.checked}`);
      out.replaceChildren(
        h("h2", {}, "Transfers to make"),
        p.transfers.length ? table(["From", "To", "Amount"], p.transfers.map((t) => h("tr", {}, h("td", {}, acct(t.from_account_id)), h("td", {}, acct(t.to_account_id)), h("td", { class: "num" }, dollars(t.amount_cents)))))
          : h("p", {}, "Nothing needed."),
        h("h2", {}, "Per account"),
        table(["Account", "Balance", "Upcoming bills", "Sends on", "Receives", "Shortfall"], p.accounts.map((a) => h("tr", {},
          h("td", {}, a.name), h("td", { class: "num" }, dollars(a.balance_cents)), h("td", { class: "num" }, dollars(a.forecast_cents)),
          h("td", { class: "num" }, dollars(a.outgoing_cents)), h("td", { class: "num" }, dollars(a.transfer_in_cents)), h("td", { class: "num" }, dollars(a.shortfall_cents))))),
        p.unassigned_forecast_cents ? h("p", {}, `Bills with no account (not counted above): ${dollars(p.unassigned_forecast_cents)}`) : "");
    });
    to.addEventListener("change", load); inc.addEventListener("change", load);
    await load();
    return [h("div", { style: "display:flex;gap:.5rem;align-items:end" }, field("Cover bills until", to), h("label", {}, inc, " include upcoming bills")), out];
  },

  async accounts() {
    const list = await loadAccounts();
    const f = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(f);
      await api("POST", "/accounts", { account: {
        name: d.get("name"), kind: d.get("kind"), funded_by_id: d.get("funded_by_id") || null,
        opening_balance_cents: toCents(d.get("opening") || 0), opening_balance_on: d.get("opening_on") || null } });
      show("accounts"); }); } },
      field("Name", h("input", { name: "name", required: true })),
      field("Kind", h("select", { name: "kind" }, ["debit", "credit", "cash"].map((k) => h("option", {}, k)))),
      field("Funded by", h("select", { name: "funded_by_id" }, h("option", { value: "" }, "(none)"), list.map((a) => h("option", { value: a.id }, a.name)))),
      field("Opening balance ($, negative if owed)", h("input", { name: "opening", type: "number", step: "0.01" })),
      field("Opening balance date", h("input", { name: "opening_on", type: "date" })),
      h("button", { type: "submit" }, "Add account"));
    return [
      h("h2", {}, "Accounts"),
      table(["ID", "Name", "Kind", "Funded by", "Balance"], list.map((a) => h("tr", {},
        h("td", {}, a.id), h("td", {}, a.name), h("td", {}, a.kind), h("td", {}, a.funded_by_id ? acct(a.funded_by_id) : ""),
        h("td", { class: "num" }, dollars(a.balance_cents))))),
      f,
    ];
  },

  async add() {
    const accounts = await loadAccounts();
    const exps = await api("GET", "/expenses");
    const f = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(f);
      const kind = d.get("kind"), cents = toCents(d.get("amount"));
      // The form takes a positive amount; the API stores money out as negative.
      await api("POST", "/transactions", { transaction: {
        source: "MAN", account_id: d.get("account_id"), kind, date: d.get("date"),
        amount_cents: kind === "expense" ? -cents : cents, description: d.get("description"), notes: d.get("notes"),
        expense_id: d.get("expense_id") || null, status: "confirmed" } });
      say("Saved."); f.reset();
    }); } },
      field("Kind", h("select", { name: "kind" }, ["expense", "income"].map((k) => h("option", {}, k)))),
      field("Account", await accountSelect("account_id", accounts)),
      field("Date", h("input", { name: "date", type: "date", required: true, value: new Date().toISOString().slice(0, 10) })),
      field("Amount ($, positive)", h("input", { name: "amount", type: "number", step: "0.01", min: "0.01", required: true })),
      field("Expense (required for expenses)", h("select", { name: "expense_id" }, h("option", { value: "" }, "(none)"), exps.map((x) => h("option", { value: x.id }, x.name)))),
      field("Description", h("input", { name: "description" })),
      field("Notes", h("textarea", { name: "notes" })),
      h("button", { type: "submit" }, "Add manual transaction"));

    const transfers = await api("GET", "/transfers");
    const t = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(t);
      await api("POST", "/transfers", { transfer: {
        from_account_id: d.get("from"), to_account_id: d.get("to"), amount_cents: toCents(d.get("amount")),
        date: d.get("date"), description: d.get("description") } });
      show("add"); }); } },
      field("From", await accountSelect("from", accounts)),
      field("To", await accountSelect("to", accounts)),
      field("Date", h("input", { name: "date", type: "date", required: true, value: new Date().toISOString().slice(0, 10) })),
      field("Amount ($)", h("input", { name: "amount", type: "number", step: "0.01", min: "0.01", required: true })),
      field("Description", h("input", { name: "description" })),
      h("button", { type: "submit" }, "Add transfer"));
    const delBtn = (x) => h("button", { onclick: () => run(async () => { await api("DELETE", "/transfers/" + x.transfer_group_id); show("add"); }) }, "delete");
    return [
      h("h2", {}, "Manual entry"), f,
      h("h2", {}, "Transfer between accounts"), t,
      table(["Date", "From", "To", "Amount", "Description", ""], transfers.map((x) => h("tr", {},
        h("td", {}, x.date), h("td", {}, acct(x.from_account_id)), h("td", {}, acct(x.to_account_id)),
        h("td", { class: "num" }, dollars(x.amount_cents)), h("td", {}, x.description || ""), h("td", {}, delBtn(x))))),
    ];
  },

  async setup() {
    const { cats, exps } = await loadLookups();
    const accts = await loadAccounts();
    const catForm = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(catForm);
      await api("POST", "/categories", { category: { name: d.get("name"), desired_source: d.get("desired_source") } });
      show("setup"); }); } },
      field("Name", h("input", { name: "name", required: true })),
      field("Desired source", h("input", { name: "desired_source" })),
      h("button", { type: "submit" }, "Add category"));
    const freqs = ["daily", "weekly", "fortnightly", "monthly", "quarterly", "biannually", "annually"];
    const expForm = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(expForm);
      const amt = d.get("expected");
      await api("POST", "/expenses", { expense: { name: d.get("name"), frequency: d.get("frequency"), category_id: d.get("category_id"),
        amount_mode: d.get("amount_mode"), expected_amount_cents: amt ? toCents(amt) : null,
        anchor_date: d.get("anchor_date") || null, ends_on: d.get("ends_on") || null, account_id: d.get("account_id") || null } });
      show("setup"); }); } },
      field("Name", h("input", { name: "name", required: true })),
      field("Frequency", h("select", { name: "frequency" }, freqs.map((x) => h("option", {}, x)))),
      field("Category", h("select", { name: "category_id", required: true }, cats.map((c) => h("option", { value: c.id }, c.name)))),
      field("Amount", h("select", { name: "amount_mode" }, ["variable", "fixed"].map((x) => h("option", {}, x)))),
      field("Expected amount ($, required if fixed)", h("input", { name: "expected", type: "number", step: "0.01", min: "0.01" })),
      field("Next due date (anchor)", h("input", { name: "anchor_date", type: "date" })),
      field("Ends on (optional)", h("input", { name: "ends_on", type: "date" })),
      field("Paid from", h("select", { name: "account_id" }, optionList(accts, "(none)"))),
      h("button", { type: "submit" }, "Add expense"));
    return [
      h("h2", {}, "Categories"), table(["ID", "Name", "Desired source"], cats.map((c) => h("tr", {}, h("td", {}, c.id), h("td", {}, c.name), h("td", {}, c.desired_source || "")))), catForm,
      h("h2", {}, "Expenses"), table(["ID", "Name", "Frequency", "Category", "Amount", "Next due", "Paid from"], exps.map((x) => h("tr", {}, h("td", {}, x.id), h("td", {}, x.name), h("td", {}, x.frequency), h("td", {}, catName(x.category_id)),
        h("td", {}, x.amount_mode + (x.expected_amount_cents ? " " + dollars(x.expected_amount_cents) : "")), h("td", {}, x.anchor_date || ""), h("td", {}, x.account_id ? acct(x.account_id) : "")))), expForm,
    ];
  },
};


// Single-transaction view: every stored field, plus an edit form limited to
// what the API allows (review fields only for bank records, nearly all for manual).
async function detail(id) {
  const [accounts, { cats, exps }] = [await loadAccounts(), await loadLookups()];
  const t = await api("GET", "/transactions/" + id);
  const manual = t.source === "MAN", transfer = t.kind === "transfer";
  const editable = transfer ? ["description", "notes"]
    : manual ? ["kind", "account_id", "date", "amount_cents", "description", "notes", "category_id", "expense_id", "status"]
    : ["notes", "category_id", "expense_id", "status"];
  const names = { account_id: acct(t.account_id), category_id: catName(t.category_id), expense_id: expName(t.expense_id) };
  const rows = Object.entries(t).map(([k, v]) => h("tr", {}, h("th", {}, k),
    h("td", {}, k === "amount_cents" ? `${v} (${dollars(v)})` : String(v ?? "")),
    h("td", {}, names[k] ?? ""), h("td", {}, editable.includes(k) ? "editable" : "fixed")));

  const input = (k) => {
    const v = t[k] ?? "";
    switch (k) {
      case "notes": return h("textarea", { name: k }, v);
      case "description": return h("input", { name: k, value: v });
      case "date": return h("input", { name: k, type: "date", value: v });
      case "amount_cents": return h("input", { name: k, type: "number", step: "0.01", value: dollars(v) });
      case "kind": return h("select", { name: k }, ["expense", "income"].map((x) => h("option", { selected: x === v }, x)));
      case "status": return h("select", { name: k }, ["pulled", "matched", "confirmed", "ignored"].map((x) => h("option", { selected: x === v }, x)));
      case "account_id": return h("select", { name: k }, accounts.map((a) => h("option", { value: a.id, selected: a.id === v }, a.name)));
      case "category_id": return h("select", { name: k }, optionList(cats, "(none)"));
      case "expense_id": return h("select", { name: k }, optionList(exps, "(none)"));
    }
  };
  const f = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
    const d = new FormData(f), body = {};
    for (const k of editable) {
      let v = d.get(k);
      if (k === "amount_cents") v = toCents(v);
      else if (["category_id", "expense_id"].includes(k)) v = v === "" ? null : v;
      body[k] = v;
    }
    await api("PATCH", "/transactions/" + id, { transaction: body });
    say("Saved."); show("detail:" + id);
  }); } },
    ...editable.map((k) => field(k + (k === "amount_cents" ? " ($, signed)" : ""), input(k))),
    h("button", { type: "submit" }, "Save"));
  // Select current values for the lookup selects (options are built before values are known).
  for (const k of ["category_id", "expense_id"]) { const el = f.elements[k]; if (el) el.value = t[k] ?? ""; }
  const note = transfer ? "Transfer leg: only description and notes can change here."
    : manual ? "Manual record: everything except source and external id can be edited."
    : "Bank record: only notes, category, expense and status can be edited.";
  return [
    h("button", { onclick: () => show("transactions") }, "← back"),
    h("h2", {}, `Transaction ${t.id}`), h("p", {}, note),
    table(["Field", "Value", "Resolved", ""], rows),
    h("h2", {}, "Edit"), f,
  ];
}

async function run(fn) { try { say(""); await fn(); } catch (e) { say(e.message, true); } }

let current = decodeURIComponent(location.hash.slice(1)) || "transactions"; // e.g. /#reconcile, /#detail:2
async function show(name) {
  current = name;
  try { history.replaceState(null, "", "#" + name); } catch {}
  $("tabs").replaceChildren(...Object.keys(views).map((k) =>
    h("button", { "aria-current": String(k === name), onclick: () => show(k) }, k)));
  $("view").replaceChildren();
  await run(async () => {
    const out = name.startsWith("detail:") ? await detail(name.slice(7)) : await views[name]();
    $("view").replaceChildren(...out);
  });
}
show(current);
</script>
</body>
