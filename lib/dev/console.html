<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>literate-robot dev console</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 60rem; margin: 1rem auto; padding: 0 1rem; }
  header { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  header input { flex: 1; min-width: 12rem; }
  nav button { margin-right: .25rem; }
  nav button[aria-current="true"] { font-weight: bold; text-decoration: underline; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #8884; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  form { display: grid; gap: .5rem; max-width: 24rem; margin-top: .5rem; }
  label { display: grid; gap: .15rem; font-size: .9rem; }
  #msg { margin: .5rem 0; min-height: 1.2rem; }
  #msg.err { color: #c33; }
</style>
</head>
<body>
<h1>literate-robot / finance</h1>
<header>
  <label style="flex:1">API key
    <input id="key" type="password" autocomplete="off" placeholder="paste a key, or set FINANCE_API_KEY in .env">
  </label>
</header>
<div id="msg"></div>
<nav id="tabs"></nav>
<main id="view"></main>

<script>
const INJECTED_KEY = __INJECTED_KEY__;

const $ = (id) => document.getElementById(id);
const keyInput = $("key");
const store = {
  get() { try { return localStorage.getItem("apiKey") || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem("apiKey", v); } catch {} },
};
keyInput.value = INJECTED_KEY || store.get();
keyInput.addEventListener("change", () => { store.set(keyInput.value); show(current); });

// Build DOM without innerHTML: record text (e.g. bank descriptions) is untrusted.
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) el.append(kid instanceof Node ? kid : String(kid ?? ""));
  return el;
}

function say(text, err = false) { const m = $("msg"); m.textContent = text; m.className = err ? "err" : ""; }

async function api(method, path, body) {
  const res = await fetch("/finance" + path, {
    method,
    headers: { Authorization: "Bearer " + keyInput.value, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) throw new Error("401 unauthorized: check the API key");
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(`${res.status}: ` + JSON.stringify(data?.errors ?? data ?? "error"));
  return data;
}

const dollars = (c) => (c / 100).toFixed(2);
let accountNames = {};
async function loadAccounts() {
  const list = await api("GET", "/accounts");
  accountNames = Object.fromEntries(list.map((a) => [a.id, a.name]));
  return list;
}
const acct = (id) => accountNames[id] ?? id;
const toCents = (s) => Math.round(Number(s) * 100);
const field = (label, input) => h("label", {}, label, input);
const table = (heads, rows) => h("table", {}, h("thead", {}, h("tr", {}, heads.map((x) => h("th", {}, x)))), h("tbody", {}, rows));

async function accountSelect(name, list) {
  return h("select", { name, required: true }, list.map((a) => h("option", { value: a.id }, a.name)));
}

async function expenseSelect(name) {
  const expenses = await api("GET", "/expenses");
  return h("select", { name, required: true }, expenses.map((e) => h("option", { value: e.id }, e.name)));
}

function txnRows(list, extra) {
  return list.map((t) => h("tr", {},
    h("td", {}, t.date), h("td", {}, acct(t.account_id)), h("td", {}, t.kind),
    h("td", {}, t.source + ":" + t.external_id.slice(0, 8)),
    h("td", {}, t.description || ""), h("td", { class: "num" }, dollars(t.amount_cents)),
    h("td", {}, t.status), h("td", {}, t.expense_id ?? ""), extra ? h("td", {}, extra(t)) : ""));
}
const txnHeads = ["Date", "Account", "Kind", "Source", "Description", "Amount", "Status", "Expense"];

const views = {
  async transactions() {
    await loadAccounts();
    const filter = h("select", {}, ["", "pulled", "matched", "confirmed"].map((s) => h("option", { value: s }, s || "all")));
    const body = h("div");
    const load = async () => {
      const list = await api("GET", "/transactions" + (filter.value ? "?status=" + filter.value : ""));
      body.replaceChildren(table(txnHeads.concat(""), txnRows(list, (t) =>
        h("button", { onclick: async () => { if (confirm("Delete?")) { await run(() => api("DELETE", "/transactions/" + t.id)); load(); } } }, "delete"))));
    };
    filter.addEventListener("change", () => run(load));
    await load();
    return [field("Status", filter), body];
  },

  async reconcile() {
    await loadAccounts();
    const list = await api("GET", "/transactions?status=pulled");
    const matched = await api("GET", "/transactions?status=matched");
    const expenses = await api("GET", "/expenses");
    const reload = () => show("reconcile");
    const pick = (t) => {
      const sel = h("select", {}, expenses.map((e) => h("option", { value: e.id }, e.name)));
      return h("span", {}, sel, h("button", { onclick: () => run(async () => { await api("POST", `/transactions/${t.id}/reconcile`, { expense_id: sel.value }); reload(); }) }, "match"));
    };
    const confirmBtn = (t) => h("button", { onclick: () => run(async () => { await api("POST", `/transactions/${t.id}/confirm`); reload(); }) }, "confirm");
    return [
      h("h2", {}, `Pulled (${list.length})`), table(txnHeads.concat(""), txnRows(list, pick)),
      h("h2", {}, `Matched, awaiting confirmation (${matched.length})`), table(txnHeads.concat(""), txnRows(matched, confirmBtn)),
    ];
  },

  async accounts() {
    const list = await loadAccounts();
    const f = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(f);
      await api("POST", "/accounts", { account: {
        name: d.get("name"), kind: d.get("kind"), funded_by_id: d.get("funded_by_id") || null,
        opening_balance_cents: toCents(d.get("opening") || 0), opening_balance_on: d.get("opening_on") || null } });
      show("accounts"); }); } },
      field("Name", h("input", { name: "name", required: true })),
      field("Kind", h("select", { name: "kind" }, ["debit", "credit", "cash"].map((k) => h("option", {}, k)))),
      field("Funded by", h("select", { name: "funded_by_id" }, h("option", { value: "" }, "(none)"), list.map((a) => h("option", { value: a.id }, a.name)))),
      field("Opening balance ($, negative if owed)", h("input", { name: "opening", type: "number", step: "0.01" })),
      field("Opening balance date", h("input", { name: "opening_on", type: "date" })),
      h("button", { type: "submit" }, "Add account"));
    return [
      h("h2", {}, "Accounts"),
      table(["ID", "Name", "Kind", "Funded by", "Balance"], list.map((a) => h("tr", {},
        h("td", {}, a.id), h("td", {}, a.name), h("td", {}, a.kind), h("td", {}, a.funded_by_id ? acct(a.funded_by_id) : ""),
        h("td", { class: "num" }, dollars(a.balance_cents))))),
      f,
    ];
  },

  async add() {
    const accounts = await loadAccounts();
    const exps = await api("GET", "/expenses");
    const f = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(f);
      const kind = d.get("kind"), cents = toCents(d.get("amount"));
      // The form takes a positive amount; the API stores money out as negative.
      await api("POST", "/transactions", { transaction: {
        source: "MAN", account_id: d.get("account_id"), kind, date: d.get("date"),
        amount_cents: kind === "expense" ? -cents : cents, description: d.get("description"), notes: d.get("notes"),
        expense_id: d.get("expense_id") || null, status: "confirmed" } });
      say("Saved."); f.reset();
    }); } },
      field("Kind", h("select", { name: "kind" }, ["expense", "income"].map((k) => h("option", {}, k)))),
      field("Account", await accountSelect("account_id", accounts)),
      field("Date", h("input", { name: "date", type: "date", required: true, value: new Date().toISOString().slice(0, 10) })),
      field("Amount ($, positive)", h("input", { name: "amount", type: "number", step: "0.01", min: "0.01", required: true })),
      field("Expense (required for expenses)", h("select", { name: "expense_id" }, h("option", { value: "" }, "(none)"), exps.map((x) => h("option", { value: x.id }, x.name)))),
      field("Description", h("input", { name: "description" })),
      field("Notes", h("textarea", { name: "notes" })),
      h("button", { type: "submit" }, "Add manual transaction"));

    const transfers = await api("GET", "/transfers");
    const t = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(t);
      await api("POST", "/transfers", { transfer: {
        from_account_id: d.get("from"), to_account_id: d.get("to"), amount_cents: toCents(d.get("amount")),
        date: d.get("date"), description: d.get("description") } });
      show("add"); }); } },
      field("From", await accountSelect("from", accounts)),
      field("To", await accountSelect("to", accounts)),
      field("Date", h("input", { name: "date", type: "date", required: true, value: new Date().toISOString().slice(0, 10) })),
      field("Amount ($)", h("input", { name: "amount", type: "number", step: "0.01", min: "0.01", required: true })),
      field("Description", h("input", { name: "description" })),
      h("button", { type: "submit" }, "Add transfer"));
    const delBtn = (x) => h("button", { onclick: () => run(async () => { await api("DELETE", "/transfers/" + x.transfer_group_id); show("add"); }) }, "delete");
    return [
      h("h2", {}, "Manual entry"), f,
      h("h2", {}, "Transfer between accounts"), t,
      table(["Date", "From", "To", "Amount", "Description", ""], transfers.map((x) => h("tr", {},
        h("td", {}, x.date), h("td", {}, acct(x.from_account_id)), h("td", {}, acct(x.to_account_id)),
        h("td", { class: "num" }, dollars(x.amount_cents)), h("td", {}, x.description || ""), h("td", {}, delBtn(x))))),
    ];
  },

  async setup() {
    const cats = await api("GET", "/expense_categories");
    const exps = await api("GET", "/expenses");
    const catForm = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(catForm);
      await api("POST", "/expense_categories", { expense_category: { name: d.get("name"), desired_source: d.get("desired_source") } });
      show("setup"); }); } },
      field("Name", h("input", { name: "name", required: true })),
      field("Desired source", h("input", { name: "desired_source" })),
      h("button", { type: "submit" }, "Add category"));
    const freqs = ["daily", "weekly", "fortnightly", "monthly", "quarterly", "biannually", "annually"];
    const expForm = h("form", { onsubmit: (e) => { e.preventDefault(); run(async () => {
      const d = new FormData(expForm);
      await api("POST", "/expenses", { expense: { name: d.get("name"), frequency: d.get("frequency"), expense_category_id: d.get("expense_category_id") } });
      show("setup"); }); } },
      field("Name", h("input", { name: "name", required: true })),
      field("Frequency", h("select", { name: "frequency" }, freqs.map((x) => h("option", {}, x)))),
      field("Category", h("select", { name: "expense_category_id", required: true }, cats.map((c) => h("option", { value: c.id }, c.name)))),
      h("button", { type: "submit" }, "Add expense"));
    return [
      h("h2", {}, "Categories"), table(["ID", "Name", "Desired source"], cats.map((c) => h("tr", {}, h("td", {}, c.id), h("td", {}, c.name), h("td", {}, c.desired_source || "")))), catForm,
      h("h2", {}, "Expenses"), table(["ID", "Name", "Frequency", "Category"], exps.map((x) => h("tr", {}, h("td", {}, x.id), h("td", {}, x.name), h("td", {}, x.frequency), h("td", {}, x.expense_category_id)))), expForm,
    ];
  },
};

async function run(fn) { try { say(""); await fn(); } catch (e) { say(e.message, true); } }

let current = "transactions";
async function show(name) {
  current = name;
  $("tabs").replaceChildren(...Object.keys(views).map((k) =>
    h("button", { "aria-current": String(k === name), onclick: () => show(k) }, k)));
  $("view").replaceChildren();
  await run(async () => { $("view").replaceChildren(...(await views[name]())); });
}
show(current);
</script>
</body>
</html>
